name: grokdesk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desk:
    runs-on: ubuntu-latest
    env:
      GROKDESK: ${{ github.workspace }}/trading-desk
      HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
      GMGN_API_KEY: ${{ secrets.GMGN_API_KEY }}
      JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
      BIRDEYE_API_KEY: ${{ secrets.BIRDEYE_API_KEY }}
      SOLSCAN_API_KEY: ${{ secrets.SOLSCAN_API_KEY }}
      LUNARCRUSH_API_KEY: ${{ secrets.LUNARCRUSH_API_KEY }}
      NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALLOWED_CHAT_ID: ${{ secrets.TELEGRAM_ALLOWED_CHAT_ID }}
      AGE_SECRET_KEY: ${{ secrets.AGE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: write .env from Actions secrets
        run: |
          umask 077
          {
            echo "HELIUS_API_KEY=${HELIUS_API_KEY}"
            echo "GMGN_API_KEY=${GMGN_API_KEY}"
            echo "JUPITER_API_KEY=${JUPITER_API_KEY}"
            echo "BIRDEYE_API_KEY=${BIRDEYE_API_KEY}"
            echo "SOLSCAN_API_KEY=${SOLSCAN_API_KEY}"
            echo "LUNARCRUSH_API_KEY=${LUNARCRUSH_API_KEY}"
            echo "NEWSAPI_KEY=${NEWSAPI_KEY}"
            echo "TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}"
            echo "TELEGRAM_ALLOWED_CHAT_ID=${TELEGRAM_ALLOWED_CHAT_ID}"
            echo "GROKDESK_RPC=https://mainnet.helius-rpc.com/?api-key=${HELIUS_API_KEY}"
          } > .env
          echo "wrote .env from repository secrets"

      - name: install age
        run: sudo apt-get update -y && sudo apt-get install -y age

      - name: decrypt secrets/env.age if present
        run: |
          set -euo pipefail
          if [ -z "${AGE_SECRET_KEY:-}" ] || [ ! -f secrets/env.age ]; then
            echo "skip age overlay"
            exit 0
          fi
          umask 077
          printf '%s\n' "$AGE_SECRET_KEY" > /tmp/age.key
          age -d -i /tmp/age.key secrets/env.age >> .env
          rm -f /tmp/age.key
          echo "appended decrypted env.age"

      - name: check
        run: bash scripts/check.sh

      - name: smoke
        run: bash scripts/smoke.sh
