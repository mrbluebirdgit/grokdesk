name: grokdesk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desk:
    runs-on: ubuntu-latest
    env:
      GROKDESK: ${{ github.workspace }}/trading-desk
      HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
      GMGN_API_KEY: ${{ secrets.GMGN_API_KEY }}
      JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
      BIRDEYE_API_KEY: ${{ secrets.BIRDEYE_API_KEY }}
      SOLSCAN_API_KEY: ${{ secrets.SOLSCAN_API_KEY }}
      LUNARCRUSH_API_KEY: ${{ secrets.LUNARCRUSH_API_KEY }}
      NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALLOWED_CHAT_ID: ${{ secrets.TELEGRAM_ALLOWED_CHAT_ID }}
      MAX_SLIPPAGE_BPS: ${{ vars.MAX_SLIPPAGE_BPS }}
      TOP10_MAX_PCT: ${{ vars.TOP10_MAX_PCT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: write .env from Actions secrets
        run: |
          umask 077
          {
            echo "HELIUS_API_KEY=${HELIUS_API_KEY}"
            echo "GMGN_API_KEY=${GMGN_API_KEY}"
            echo "JUPITER_API_KEY=${JUPITER_API_KEY}"
            echo "BIRDEYE_API_KEY=${BIRDEYE_API_KEY}"
            echo "SOLSCAN_API_KEY=${SOLSCAN_API_KEY}"
            echo "LUNARCRUSH_API_KEY=${LUNARCRUSH_API_KEY}"
            echo "NEWSAPI_KEY=${NEWSAPI_KEY}"
            echo "TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}"
            echo "TELEGRAM_ALLOWED_CHAT_ID=${TELEGRAM_ALLOWED_CHAT_ID}"
          } > .env
          echo "wrote .env from repository secrets"

      - name: check
        run: bash scripts/check.sh

      - name: smoke
        run: bash scripts/smoke.sh

      - name: live quotes
        run: |
          set -euo pipefail
          python tools/authority_check.py --mint So11111111111111111111111111111111111111112
          python tools/jupiter_quote.py --output-mint EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v --amount 1000000
          python tools/birdeye_price.py --mint So11111111111111111111111111111111111111112
          python tools/priority_fee.py
